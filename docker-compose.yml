version: "3.9"

services:
  logsentinel:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./examples/logs:/app/examples/logs
    environment:
      - LOGSENTINEL_MODEL_DIR=/app/models
      - LOGSENTINEL_LOG_LEVEL=INFO
    command: >
      sh -c "logsentinel train --input-dir /app/examples/logs --model-dir /app/models
      && logsentinelserve --host 0.0.0.0 --port 8000 --model-dir /app/models"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
